'$schema': https://json-schema.org/draft/2020-12/schema
'$id': https://socioprophet.io/schemas/evidence_ledger.v0_1.json
title: Evidence Ledger Entry
description: Content-addressable evidence record for SRC-010 and SRC-011 evidence custody.
type: object
required:
  - evidence_id
  - sha256
  - created_utc
  - source
  - uaibb_mapping
  - tokens
additionalProperties: false
properties:
  evidence_id:
    type: string
    format: uuid
  sha256:
    type: string
    pattern: '^[a-f0-9]{64}$'
  created_utc:
    type: string
    format: date-time
  signer_did:
    type: string
  signature:
    type: string
  prev_hash:
    type:
      - string
      - 'null'
    pattern: '^[a-f0-9]{64}$'
  source:
    type: object
    required:
      - kind
    properties:
      kind:
        type: string
        enum: [upload, sensor, spawn, import, derived]
      filename:
        type: string
      src_id:
        type: string
        pattern: '^SRC-[0-9]{3}$'
      bytes:
        type: integer
        minimum: 0
      media_type:
        type: string
  uaibb_mapping:
    type: object
    required:
      - layer
      - topological_class
    properties:
      layer:
        type: string
        enum:
          - UAIBB_shell_global_modes
          - SAI_interlocks
          - SAI_suspend_state
          - SAI_memory
          - UAIBB_broadcast
          - SAI_inference_loop
          - SAI_arbitration
          - seed_substrate
          - bio_digital_bridge
          - UAIBB_orientation
          - spawn_diversity
          - systemic_stability
      topological_class:
        type: string
        enum:
          - S2_S3_Hopf_lift
          - brunnian_link
          - toroid
          - aperiodic_long_range_order
          - spherical_harmonics
          - phase_reset_trajectory
          - WTA_on_manifold
          - redox_threshold
          - 2D_conductor_on_curved_biofilm
          - spherical_coords
          - recursive_combinatorics
          - S2_systemic_manifold
      genome_correlate:
        type: string
      neuromorphic_correlate:
        type: string
      why_it_matters:
        type: string
  tokens:
    type: object
    additionalProperties: false
    properties:
      ips:
        type: array
        items: {type: string, format: ipv4}
      ipv6:
        type: array
        items: {type: string, format: ipv6}
      macs:
        type: array
        items: {type: string, pattern: '^([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$'}
      urls:
        type: array
        items: {type: string, format: uri}
      domains:
        type: array
        items: {type: string, format: hostname}
      emails:
        type: array
        items: {type: string, format: email}
      phones:
        type: array
        items: {type: string}
      uuids:
        type: array
        items: {type: string, format: uuid}
      jwts:
        type: array
        items: {type: string}
      etags:
        type: array
        items: {type: string}
      serials:
        type: array
        items: {type: string}
      imei:
        type: array
        items: {type: string, pattern: '^[0-9]{15}$'}
      imsi:
        type: array
        items: {type: string, pattern: '^[0-9]{14,15}$'}
      asns:
        type: array
        items: {type: string, pattern: '^AS[0-9]+$'}
      timestamps:
        type: array
        items: {type: string, format: date-time}
      hashes:
        type: array
        items: {type: string, pattern: '^[a-fA-F0-9]{32,128}$'}
  chain_of_custody:
    type: array
    items:
      type: object
      required: [actor_did, action, at]
      properties:
        actor_did: {type: string}
        action:
          type: string
          enum: [ingest, validate, annotate, replicate, redact, export]
        at: {type: string, format: date-time}
        node_id: {type: string}
        notes: {type: string}
  claim_refs:
    type: array
    items: {type: string, format: uuid}
