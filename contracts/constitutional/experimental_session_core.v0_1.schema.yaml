'$schema': https://json-schema.org/draft/2020-12/schema
'$id': https://socioprophet.io/schemas/experimental_session_core.v0_1.json
title: Consent-Bound Session Core Record
description: Minimal consent-bound session core. Full experimental-session schema remains a follow-up artifact.
type: object
required:
  - session_id
  - participant_id
  - consent_ref
  - datetime_utc
  - topic_class
  - target_id
  - stage_mix
additionalProperties: false
properties:
  session_id:
    type: string
    format: uuid
  participant_id:
    type: string
    format: uuid
  consent_ref:
    type: object
    required: [consent_version, consent_hash, scope, withdrawn]
    properties:
      consent_version: {type: string}
      consent_hash:
        type: string
        pattern: '^[a-f0-9]{64}$'
      scope:
        type: string
        enum: [per_prompt, per_session, per_study]
      withdrawn:
        type: boolean
      granted_at:
        type: string
        format: date-time
  datetime_utc:
    type: string
    format: date-time
  topic_class:
    type: integer
    minimum: 1
    maximum: 12
  target_id:
    type: string
    format: uuid
  decoy_set_id:
    type: string
    format: uuid
  is_sham:
    type: boolean
  stage_mix:
    type: object
    required: [I, II, III, IV, V]
    properties:
      I: {type: number, minimum: 0, maximum: 1}
      II: {type: number, minimum: 0, maximum: 1}
      III: {type: number, minimum: 0, maximum: 1}
      IV: {type: number, minimum: 0, maximum: 1}
      V: {type: number, minimum: 0, maximum: 1}
  raw_artifact_hash:
    type: string
    pattern: '^[a-f0-9]{64}$'
  judgments:
    type: array
    items:
      type: string
      format: uuid
