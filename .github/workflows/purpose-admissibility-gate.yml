name: Purpose Admissibility Gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install jsonschema pyyaml pytest
      - run: python tools/validate_purpose_admissibility_gate.py
      - name: Decision engine (admit/deny proven both ways, fail-closed)
        run: python -m pytest tools/tests/test_purpose_admissibility_gate_engine.py -q
      - name: telemetry.emit binding (consent is load-bearing, not decorative)
        run: python -m pytest tools/tests/test_telemetry_emit_binding.py -q
