name: lattice-runtime-promotion-policy

on:
  pull_request:
    paths:
      - "examples/lattice-runtime-promotion-policy.example.json"
      - "tools/validate_lattice_runtime_promotion_policy.py"
      - ".github/workflows/lattice-runtime-promotion-policy.yml"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate runtime promotion policy
        run: python tools/validate_lattice_runtime_promotion_policy.py
