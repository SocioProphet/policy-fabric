name: Repo Health

on:
  push:
    branches:
      - main
      - 'work/**'
      - 'docs/**'
      - 'fix/**'
      - 'spike/**'
      - 'ops/**'
  pull_request:

jobs:
  repo-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Checkout non-PR ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Git refs for branch audit
        run: |
          git fetch --force --tags origin
          git fetch --force origin main:refs/heads/main || true
          git branch --list
          git tag --list

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema pyyaml

      - name: Reconcile
        run: python scripts/reconcile.py

      - name: Branch audit
        run: python scripts/branch_audit.py

      - name: AgentPlane probe
        run: python scripts/agentplane_probe.py

      - name: GitHub publish prep
        run: python scripts/github_publish_prep.py

      - name: Academy visibility contracts
        run: python scripts/validate_academy_visibility_contracts.py

      - name: Fog control contracts
        run: python scripts/validate_fog_control_contracts.py

      - name: Prophet operations action decision contracts
        run: python scripts/validate_prophet_operations_action_decision.py

      - name: Operation plane policy gate contracts
        run: python scripts/validate_operation_plane_policy_gate.py

      - name: Doctor
        run: python scripts/doctor.py

      - name: Build distributable bundle
        run: python scripts/build_dist_bundle.py
