name: Bug report
description: Report a defect in contracts, validation, workflow, or release artifacts.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, commands, branch, and relevant generated reports.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Artifacts and reports
      description: Reference report files, bundle contents, or validation codes.
